[project]
name = "meld-realtime"
version = "0.1.0"
description = "real-time text + audio emotion state and grounded replies on MELD, local inference only"
readme = "README.md"
requires-python = ">=3.12,<3.14"
dependencies = [
  "numpy>=2.0",
  "onnxruntime>=1.20",
  "onnx>=1.17",
  "kaldi-native-fbank>=1.20",
  "tokenizers>=0.20",
  "pyzmq>=26",
  "scikit-learn>=1.5",
  "pyyaml>=6.0",
  "jiwer>=3.0",
  "psutil>=6.0",
  "soundfile>=0.12",
]

[project.optional-dependencies]
prosody = ["praat-parselmouth>=0.4.3"]
mic = ["sounddevice>=0.5"]
tts = ["sherpa-onnx==1.13.8", "sherpa-onnx-core==1.13.8"]
finetune = ["torch>=2.4", "transformers>=4.45"]

[dependency-groups]
dev = ["pytest>=8.0", "msgpack>=1.0", "sherpa-onnx==1.13.8", "sherpa-onnx-core==1.13.8", "praat-parselmouth>=0.4.3"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["meld_rt"]

[tool.pytest.ini_options]
testpaths = ["tests"]
