name: windows-check
on:
  push:
    branches: [windows]
  workflow_dispatch:
jobs:
  windows:
    runs-on: windows-latest
    timeout-minutes: 120
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@v4
      - name: install uv
        run: |
          powershell -ExecutionPolicy ByPass -c "irm https://astral.sh/uv/install.ps1 | iex"
          Add-Content $env:GITHUB_PATH "$env:USERPROFILE\.local\bin"
      - name: sync
        run: uv sync --extra mic --extra vision
      - name: models cache
        uses: actions/cache@v4
        with:
          path: models
          key: meld-models-${{ hashFiles('tools/fetch_models.py') }}
      - name: fetch models and data
        run: |
          uv run python tools/fetch_models.py --dest models/
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          uv run python tools/fetch_meld_csv.py
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          uv run python tools/make_proxy_clips.py
      - name: pytest
        continue-on-error: true
        run: uv run pytest -q -rs
      - name: demo docs check
        continue-on-error: true
        run: uv run python tools/render_demo_docs.py --check
      - name: count params
        continue-on-error: true
        run: uv run python tools/count_params.py --models models/ --heads heads/ --out "$env:RUNNER_TEMP\params.md"
      - name: bench components
        continue-on-error: true
        run: uv run python tools/bench_components.py --threads 1 --runs 5 --clips "$env:RUNNER_TEMP\bench_clips" --out "$env:RUNNER_TEMP\bench_components.json"
      - name: replay bench one clip
        continue-on-error: true
        run: uv run python tools/replay_bench.py --clips models/sensevoice/test_wavs/en.wav --n 1 --warmup 0 --out "$env:RUNNER_TEMP\replay_bench.json"
      - name: render measurements
        continue-on-error: true
        run: |
          New-Item -ItemType Directory -Force "$env:RUNNER_TEMP\res" | Out-Null
          Copy-Item "$env:RUNNER_TEMP\bench_components.json" "$env:RUNNER_TEMP\res\bench_components_win.json"
          uv run python tools/render_measurements.py --results "$env:RUNNER_TEMP\res" --out "$env:RUNNER_TEMP\measurements.md"
          Get-Content "$env:RUNNER_TEMP\measurements.md" | Select-Object -First 40
      - name: demo.py on en.wav
        continue-on-error: true
        run: |
          $env:DEMO_LOG = "$env:RUNNER_TEMP\demo_log.jsonl"
          uv run python demo.py models/sensevoice/test_wavs/en.wav
      - name: mic list devices
        continue-on-error: true
        run: uv run python -m meld_rt.clients.mic --list-devices
