# reply bank (design 1.9). cells are "<fused label>|<discrepancy direction>".
# direction mixed shares the none cell. styles: acknowledge, ask, name_the_gap.
# rules: at most 12 words, slot templates at most 8 words, second person,
# no contractions, no exclamation marks, no emoji, no therapy-speak.
# {keyphrase} is filled from the transcript and can be a clause fragment, so
# every slot line puts it in single quotes.
# a name_the_gap line says what the words and the tone disagree about.

cells:
  "neutral|none":
    - {id: neutral_none_01, style: acknowledge, text: "A plain account, in a level voice."}
    - {id: neutral_none_02, style: acknowledge, text: "You state '{keyphrase}' as a plain fact."}
    - {id: neutral_none_03, style: ask, text: "After '{keyphrase}', what came next?"}
    - {id: neutral_none_04, style: ask, text: "What did you do after that?"}
  "neutral|tone_more_negative":
    - {id: neutral_neg_01, style: acknowledge, text: "The facts are neutral. Your voice dropped while giving them."}
    - {id: neutral_neg_02, style: name_the_gap, text: "Even words. Your voice fell on '{keyphrase}'."}
    - {id: neutral_neg_03, style: name_the_gap, text: "Nothing in the words is negative. Your tone is."}
    - {id: neutral_neg_04, style: ask, text: "Why the lower voice, if the news itself is neutral?"}
  "neutral|tone_more_positive":
    - {id: neutral_pos_01, style: acknowledge, text: "Plain words. Your voice is more upbeat than they are."}
    - {id: neutral_pos_02, style: name_the_gap, text: "The words are neutral. The tone is pleased."}
    - {id: neutral_pos_03, style: name_the_gap, text: "Flat words. A pleased voice on '{keyphrase}'."}
    - {id: neutral_pos_04, style: ask, text: "Is '{keyphrase}' better news than you are saying?"}
  "neutral|tone_surprised":
    - {id: neutral_surp_01, style: acknowledge, text: "That was news to you."}
    - {id: neutral_surp_02, style: name_the_gap, text: "Matter-of-fact words. A surprised voice."}
    - {id: neutral_surp_03, style: name_the_gap, text: "Calm words, but '{keyphrase}' sounded startled."}
    - {id: neutral_surp_04, style: ask, text: "When did you find out?"}

  "surprise|none":
    - {id: surprise_none_01, style: acknowledge, text: "Words and voice agree: that was a surprise."}
    - {id: surprise_none_02, style: acknowledge, text: "You did not expect '{keyphrase}'."}
    - {id: surprise_none_03, style: ask, text: "Instead of '{keyphrase}', what did you expect?"}
    - {id: surprise_none_04, style: ask, text: "A good surprise, or a bad one?"}
  "surprise|tone_more_negative":
    - {id: surprise_neg_01, style: acknowledge, text: "An unwelcome surprise, going by your voice."}
    - {id: surprise_neg_02, style: name_the_gap, text: "The words are surprised. The tone is unhappy about it."}
    - {id: surprise_neg_03, style: name_the_gap, text: "Surprised words on '{keyphrase}', in an unhappy voice."}
    - {id: surprise_neg_04, style: ask, text: "Is this a worry, or only a surprise?"}
  "surprise|tone_more_positive":
    - {id: surprise_pos_01, style: acknowledge, text: "That surprise pleased you. I can tell from the voice."}
    - {id: surprise_pos_02, style: name_the_gap, text: "The words only register surprise. The voice is glad."}
    - {id: surprise_pos_03, style: name_the_gap, text: "Surprised words on '{keyphrase}'. Your voice sounds glad."}
    - {id: surprise_pos_04, style: ask, text: "Did that surprise turn out well for you?"}
  "surprise|tone_surprised":
    - {id: surprise_surp_01, style: acknowledge, text: "More surprise in the voice than in the words."}
    - {id: surprise_surp_02, style: name_the_gap, text: "The words are calm. The voice is startled."}
    - {id: surprise_surp_03, style: name_the_gap, text: "Mild words, but your voice jumped at '{keyphrase}'."}
    - {id: surprise_surp_04, style: ask, text: "What about '{keyphrase}' surprised you?"}

  "fear|none":
    - {id: fear_none_01, style: acknowledge, text: "That frightened you. The words and the voice agree on it."}
    - {id: fear_none_02, style: acknowledge, text: "When you said '{keyphrase}', you sounded worried."}
    - {id: fear_none_03, style: ask, text: "What do you think will happen?"}
    - {id: fear_none_04, style: ask, text: "What is the risk with '{keyphrase}'?"}
  "fear|tone_more_negative":
    - {id: fear_neg_01, style: acknowledge, text: "You are more scared than you are saying."}
    - {id: fear_neg_02, style: name_the_gap, text: "The words are careful. Your voice is not steady."}
    - {id: fear_neg_03, style: name_the_gap, text: "About '{keyphrase}': calm words, tense voice."}
    - {id: fear_neg_04, style: ask, text: "Is it worse than you are telling me?"}
  "fear|tone_more_positive":
    - {id: fear_pos_01, style: acknowledge, text: "Worried words, but your voice is calmer."}
    - {id: fear_pos_02, style: name_the_gap, text: "You say you are scared. Your voice is calm."}
    - {id: fear_pos_03, style: name_the_gap, text: "On '{keyphrase}', fearful words and a settled voice."}
    - {id: fear_pos_04, style: ask, text: "Is the worst of it over?"}
  "fear|tone_surprised":
    - {id: fear_surp_01, style: acknowledge, text: "That was a shock as well as a worry."}
    - {id: fear_surp_02, style: name_the_gap, text: "Worry in the words. Surprise in the voice."}
    - {id: fear_surp_03, style: name_the_gap, text: "Worried words on '{keyphrase}'. Your voice sounds startled."}
    - {id: fear_surp_04, style: ask, text: "Did you have any warning?"}

  "sadness|none":
    - {id: sadness_none_01, style: acknowledge, text: "Sad words, and a sad voice to match."}
    - {id: sadness_none_02, style: acknowledge, text: "You sound sad saying '{keyphrase}'."}
    - {id: sadness_none_03, style: ask, text: "You said '{keyphrase}'. When was that?"}
    - {id: sadness_none_04, style: ask, text: "How long has this been going on?"}
  "sadness|tone_more_negative":
    - {id: sadness_neg_01, style: acknowledge, text: "You are sadder than the words say."}
    - {id: sadness_neg_02, style: name_the_gap, text: "The words say it is fine. The voice is low."}
    - {id: sadness_neg_03, style: name_the_gap, text: "Light words on '{keyphrase}'. A sad voice."}
    - {id: sadness_neg_04, style: ask, text: "What are you leaving out of the words?"}
  "sadness|tone_more_positive":
    - {id: sadness_pos_01, style: acknowledge, text: "Sad news, but you are steadier than the words."}
    - {id: sadness_pos_02, style: name_the_gap, text: "The words are sad. The tone is close to relief."}
    - {id: sadness_pos_03, style: name_the_gap, text: "Sad words on '{keyphrase}', said lightly."}
    - {id: sadness_pos_04, style: ask, text: "Has some of it already passed?"}
  "sadness|tone_surprised":
    - {id: sadness_surp_01, style: acknowledge, text: "That was a loss, and you did not expect it."}
    - {id: sadness_surp_02, style: name_the_gap, text: "Sad words. Your voice is more surprised than sad."}
    - {id: sadness_surp_03, style: name_the_gap, text: "Sad words, but '{keyphrase}' sounded like a shock."}
    - {id: sadness_surp_04, style: ask, text: "Did it happen all at once?"}

  "joy|none":
    - {id: joy_none_01, style: acknowledge, text: "Good news, and you sound glad about it."}
    - {id: joy_none_02, style: acknowledge, text: "You sound pleased about '{keyphrase}'."}
    - {id: joy_none_03, style: ask, text: "What led up to '{keyphrase}'?"}
    - {id: joy_none_04, style: ask, text: "What do you do with it now?"}
  "joy|tone_more_negative":
    - {id: joy_neg_01, style: acknowledge, text: "Good news, told in a flat voice."}
    - {id: joy_neg_02, style: name_the_gap, text: "The words are happy. The tone is not."}
    - {id: joy_neg_03, style: name_the_gap, text: "Pleased words on '{keyphrase}'. A flat voice."}
    - {id: joy_neg_04, style: ask, text: "What is wrong with the good news?"}
  "joy|tone_more_positive":
    - {id: joy_pos_01, style: acknowledge, text: "This pleases you more than the words admit."}
    - {id: joy_pos_02, style: name_the_gap, text: "The words are modest. The tone is delighted."}
    - {id: joy_pos_03, style: name_the_gap, text: "You downplay '{keyphrase}'. You sound proud."}
    - {id: joy_pos_04, style: ask, text: "What part are you holding back?"}
  "joy|tone_surprised":
    - {id: joy_surp_01, style: acknowledge, text: "A happy surprise, then."}
    - {id: joy_surp_02, style: name_the_gap, text: "Pleased words. The voice adds surprise."}
    - {id: joy_surp_03, style: name_the_gap, text: "Glad words about '{keyphrase}'. Your voice sounds surprised."}
    - {id: joy_surp_04, style: ask, text: "Did you think it would go this well?"}

  "disgust|none":
    - {id: disgust_none_01, style: acknowledge, text: "That put you off, in the words and the voice."}
    - {id: disgust_none_02, style: acknowledge, text: "You want no part of '{keyphrase}'."}
    - {id: disgust_none_03, style: ask, text: "What bothers you about '{keyphrase}'?"}
    - {id: disgust_none_04, style: ask, text: "Has it always been like this?"}
  "disgust|tone_more_negative":
    - {id: disgust_neg_01, style: acknowledge, text: "Measured words. The voice is disgusted."}
    - {id: disgust_neg_02, style: name_the_gap, text: "You put it politely. Your tone is not polite."}
    - {id: disgust_neg_03, style: name_the_gap, text: "You keep '{keyphrase}' civil. Your tone does not."}
    - {id: disgust_neg_04, style: ask, text: "How much does it bother you?"}
  "disgust|tone_more_positive":
    - {id: disgust_pos_01, style: acknowledge, text: "Harsh words, said with some amusement."}
    - {id: disgust_pos_02, style: name_the_gap, text: "The words are disgusted. The tone is amused."}
    - {id: disgust_pos_03, style: name_the_gap, text: "You reject '{keyphrase}', half laughing."}
    - {id: disgust_pos_04, style: ask, text: "Do you find '{keyphrase}' funny, or awful?"}
  "disgust|tone_surprised":
    - {id: disgust_surp_01, style: acknowledge, text: "That was unexpected, and unpleasant."}
    - {id: disgust_surp_02, style: name_the_gap, text: "Disgusted words, but the tone is plain surprise."}
    - {id: disgust_surp_03, style: name_the_gap, text: "The words reject '{keyphrase}'. The voice sounds startled."}
    - {id: disgust_surp_04, style: ask, text: "Where did you come across it?"}

  "anger|none":
    - {id: anger_none_01, style: acknowledge, text: "You are angry about this, and you say it plainly."}
    - {id: anger_none_02, style: acknowledge, text: "You are angry, and '{keyphrase}' is the reason."}
    - {id: anger_none_03, style: ask, text: "Who is responsible for '{keyphrase}'?"}
    - {id: anger_none_04, style: ask, text: "What would fix this?"}
  "anger|tone_more_negative":
    - {id: anger_neg_01, style: acknowledge, text: "Your words are holding back. Your voice is not."}
    - {id: anger_neg_02, style: name_the_gap, text: "The words are reasonable. The tone is angry."}
    - {id: anger_neg_03, style: name_the_gap, text: "You stay calm about '{keyphrase}' in words only."}
    - {id: anger_neg_04, style: ask, text: "How angry are you, if you say it straight?"}
  "anger|tone_more_positive":
    - {id: anger_pos_01, style: acknowledge, text: "Angry words, in an easy voice."}
    - {id: anger_pos_02, style: name_the_gap, text: "The words are furious. You sound close to laughing."}
    - {id: anger_pos_03, style: name_the_gap, text: "You attack '{keyphrase}' in words, not in tone."}
    - {id: anger_pos_04, style: ask, text: "Is '{keyphrase}' still a problem, or settled?"}
  "anger|tone_surprised":
    - {id: anger_surp_01, style: acknowledge, text: "That angered you, and it was sudden."}
    - {id: anger_surp_02, style: name_the_gap, text: "The words are angry. The voice is mostly surprise."}
    - {id: anger_surp_03, style: name_the_gap, text: "You blame '{keyphrase}'. You sound stunned, not angry."}
    - {id: anger_surp_04, style: ask, text: "What happened right before this?"}

# no emotion claim. used when fused confidence is below low_conf
hold_back:
  - {id: hold_back_01, text: "Go on, I am listening."}
  - {id: hold_back_02, text: "Say the rest of it."}
  - {id: hold_back_03, text: "I need to hear more before I answer."}
  - {id: hold_back_04, text: "There is no hurry."}
  - {id: hold_back_05, text: "Finish the thought. I will wait."}
  - {id: hold_back_06, text: "And then what happened?"}

# the "did not catch that" response of design 1.4 (style hold_back)
asr_failed:
  - {id: asr_failed_01, text: "I missed the words. Could you repeat that?"}
  - {id: asr_failed_02, text: "That did not come through. Again, please."}

# prepended when laughter or cry exceeds 0.5
event_prefix:
  laughter:
    - "You laughed there."
    - "There was a laugh in that."
  cry:
    - "You sound close to tears."
    - "That sounded like crying."
